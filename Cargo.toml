[package]
name = "vimhelp-index"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Full-text index and search over vimdoc (:h)"
license = "MIT"
repository = "https://github.com/jedi-knights/vimhelp-index"

[dependencies]
# CLI + args
clap = { version = "4.5", features = ["derive"] }
# error handling — anyhow at the binary boundary, thiserror in domain
anyhow = "1"
thiserror = "2"
# serde for future JSON output shape
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# glob resolves the --docs pattern the user supplies
glob = "0.3"
# regex — vimdoc tag extraction: *name* with a bounded character class
regex = "1"
# tantivy — full-text index engine. Chosen over bleve/lucene ports because
# it's Rust-native (no FFI), mature, and the reference for full-text search
# in the Rust ecosystem. Adds ~60-90s to first CI compile; cache handles it.
tantivy = "0.22"

[dev-dependencies]
# snapshot tests for the parser output shape
insta = { version = "1.40", features = ["json"] }
# end-to-end CLI tests
assert_cmd = "2"
predicates = "3"
# scratch directories for fixture-driven parser tests
tempfile = "3"
# deterministic mtime bumps in CLI e2e tests — HFS+ rounds to whole seconds,
# so a plain `std::fs::write` between two build calls doesn't reliably move
# mtime in the same test run.
filetime = "0.2"

[[bin]]
name = "vimhelp-index"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1

# cargo-dist builds release artifacts against this named profile — see
# .github/workflows/dist.yml. Without it the workflow fails with
# `error: profile 'dist' is not defined` before touching the compiler,
# so no binaries get attached to the GitHub Release (observed on v0.0.0).
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
